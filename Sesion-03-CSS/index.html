<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Tarea CSS</title>
    <link rel="stylesheet"  href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Galería de Productos</h1>

        <!-- TODO: Galería de productos
             Cada tarjeta debe contener:
             - Imagen del producto (usa placeholder o imágenes de ejemplo)
             - Nombre del producto
             - Precio
             - Botón con texto "Comprar"
             
             Desktop (>=1024px): 3 columnas
             Mobile (<768px): 1 columna con scroll vertical
        -->
        <section class="galeria">

            <article class="producto">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQh55rr2CpiRuSUtMtv5wnQleNKELDqdt51xTSQJhFM2KZK8ljl4JIGsgY&s=10" alt="Producto 1">
                <div class="producto-info">
                    <h2>figura de aslan </h2>
                    <p class="precio">Q99.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEfAsKr_CRm05QMouGAazRh3YaHnZv6xxmvD8hVyNiow&s=10" alt="Producto 2">
                <div class="producto-info">
                    <h2>tinker bell</h2>
                    <p class="precio">Q149.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPpu8eDymjOhLtHWlPAU2yPd23rDcp_dciC_syqsnDYQ&s=10" alt="Producto 3">
                <div class="producto-info">
                    <h2>Optimus Prime</h2>
                    <p class="precio">Q199.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFjJWGHYv5Rs9dnq1Xr4liL6ufwNChdfDUtNIjnErsBA&s=10" alt="Producto 4">
                <div class="producto-info">
                    <h2>Brujula de Jack Sparrow</h2>
                    <p class="precio">Q79.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTAY2unIKKoTNRnnYG53demfrh_pcxI5LEtCDL_SdZ5OA&s=10" alt="Producto 5">
                <div class="producto-info">
                    <h2>Hermanos pevensie</h2>
                    <p class="precio">Q249.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQw7iRas5303t51DljULXmYylgp6YcCJsouCl4bqFYL9w&s=10" alt="Producto 6">
                <div class="producto-info">
                    <h2>coleccion hadas Tinker Bell</h2>
                    <p class="precio">Q299.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

        <h2>To-Do List</h2>

        <!-- TODO: Layout de Todo List
             Lista de tareas estilizada con:
             - Checkbox para marcar completado
             - Texto de la tarea
             - Diseño limpio y accesible
        -->
        <section class="todo-list">
            <ul class="tareas" role="list">
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Aprender CSS Grid</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Practicar Flexbox</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Estudiar diseño responsivo</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Hacer la tarea de CSS</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Revisar novedades de CSS 2024</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
